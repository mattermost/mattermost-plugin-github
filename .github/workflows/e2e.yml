name: e2e
on:
  schedule:
    - cron: "0 3 * * *"
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: playwright (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: min-server
            image: mattermost/mattermost-enterprise-edition:release-12.0
          - name: master
            image: mattermostdevelopment/mattermost-enterprise-edition:master
    env:
      CI: true
      MM_IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            e2e/integration/package-lock.json

      - name: Build E2E plugin bundle
        run: make e2e-dist
        env:
          # Builds only for the runner's OS/arch.
          MM_SERVICESETTINGS_ENABLEDEVELOPER: true

      - name: Install e2e dependencies
        working-directory: e2e/integration
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Type-check e2e
        working-directory: e2e/integration
        run: npm run tsc

      - name: Start Mattermost
        working-directory: e2e/integration
        run: npm run env:up

      - name: Run Playwright
        working-directory: e2e/integration
        run: npm run test:ci

      - name: Collect server logs
        if: failure()
        working-directory: e2e/integration
        run: mkdir -p playwright-report && docker compose logs mattermost > playwright-report/mattermost.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.name }}
          path: e2e/integration/playwright-report
          retention-days: 14

  # Non-blocking: a screenshot diff needs a person to judge whether the change is intended.
  visual:
    name: playwright visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            e2e/integration/package-lock.json

      - name: Build E2E plugin bundle
        run: make e2e-dist
        env:
          MM_SERVICESETTINGS_ENABLEDEVELOPER: true

      - name: Install e2e dependencies
        working-directory: e2e/integration
        run: npm ci

      - name: Compare screenshots
        working-directory: e2e/integration
        run: npm run test:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-visual-diffs
          path: |
            e2e/integration/playwright-report
            e2e/integration/test-results
          retention-days: 14

  # Fails only on breaking drift (exit 1); additive changes are listed in the log. A failed download
  # exits 2 and fails the run without opening an issue.
  contract-drift:
    name: fake-github contract drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      drift: ${{ steps.check.outputs.drift }}
      report: ${{ steps.check.outputs.report }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/integration/package-lock.json

      - name: Install e2e dependencies
        working-directory: e2e/integration
        run: npm ci

      - name: Test the drift classification
        working-directory: e2e/integration
        run: npm run contract:test

      - name: Compare committed specs with GitHub's published REST description and GraphQL schema
        id: check
        working-directory: e2e/integration
        run: |
          set +e
          npm run --silent contract:check > "$RUNNER_TEMP/drift.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/drift.log"
          echo "drift=$([ "$status" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          delimiter="report_$(openssl rand -hex 16)"
          {
            echo "report<<$delimiter"
            tail -c 60000 "$RUNNER_TEMP/drift.log"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          exit $status

  # Breaking drift opens a "GitHub API contract drift" issue, or comments on the open one, so it
  # reaches people instead of only turning a scheduled run red.
  contract-drift-report:
    name: report contract drift
    needs: contract-drift
    if: failure() && github.event_name == 'schedule' && needs.contract-drift.outputs.drift == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT: ${{ needs.contract-drift.outputs.report }}
        run: |
          title="GitHub API contract drift"
          body=$(printf 'The nightly e2e contract check found breaking changes in GitHub'"'"'s published REST description or GraphQL schema: %s\n\n```\n%s\n```\n\nRun `npm run contract:update` in e2e/integration, review the diff, and update fake-github and the plugin to match.' "$RUN_URL" "$REPORT")
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi

  real-github:
    name: real github.com journey
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.REAL_GITHUB_E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The fixtures and hook on the test repository are shared between runs.
    concurrency:
      group: real-github-e2e
      cancel-in-progress: false
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            webapp/package-lock.json
            e2e/integration/package-lock.json

      - name: Build plugin bundle
        run: make dist
        env:
          MM_SERVICESETTINGS_ENABLEDEVELOPER: true

      - name: Install e2e dependencies
        working-directory: e2e/integration
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Start Mattermost
        working-directory: e2e/integration
        run: npm run env:up

      # No report upload: it would carry real tokens and page content.
      - name: Run journey
        working-directory: e2e/integration
        run: npm run test:real
        env:
          E2E_GITHUB_OAUTH_CLIENT_ID: ${{ secrets.E2E_GITHUB_OAUTH_CLIENT_ID }}
          E2E_GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.E2E_GITHUB_OAUTH_CLIENT_SECRET }}
          E2E_GITHUB_REPO: ${{ secrets.E2E_GITHUB_REPO }}
          E2E_GITHUB_MACHINE_TOKEN: ${{ secrets.E2E_GITHUB_MACHINE_TOKEN }}
          E2E_GITHUB_LOGIN_USERNAME: ${{ secrets.E2E_GITHUB_LOGIN_USERNAME }}
          E2E_GITHUB_LOGIN_PASSWORD: ${{ secrets.E2E_GITHUB_LOGIN_PASSWORD }}
          E2E_GITHUB_LOGIN_TOTP_SECRET: ${{ secrets.E2E_GITHUB_LOGIN_TOTP_SECRET }}
